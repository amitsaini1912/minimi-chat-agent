<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <button id="new-chat">+ New chat</button>
    <nav id="conversations"></nav>
  </aside>
  <main>
    <div id="thread">
      <div id="empty">
        <h1>Ask anything.</h1>
        <p>I search the web when the answer might have changed, and I remember our past conversations by date.</p>
      </div>
    </div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
      <button id="send" type="submit" aria-label="Send">↑</button>
    </form>
  </main>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
